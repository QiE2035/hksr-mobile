[package]
name = "hksr-mobile"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
env_logger = "0.11.11"
goblin = "0.10.7"
iced-x86 = { version = "1.21.0", features = ["code_asm", "masm"] }
log = "0.4.33"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["preserve_order"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
